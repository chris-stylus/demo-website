<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Website | Aditya Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 25, 40, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --secondary: #a855f7;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background elements */
    .bg-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      z-index: 1;
      animation: float-glow 15s infinite alternate ease-in-out;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      z-index: 1;
      animation: float-glow 20s infinite alternate-reverse ease-in-out;
    }

    @keyframes float-glow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 700px;
      padding: 40px 20px;
      text-align: center;
    }

    /* Glassmorphic Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 50px 40px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.15);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 24px;
      animation: pulse-border 2s infinite;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Typography */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Tech Stack Diagram */
    .flow-diagram {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 40px 0;
      position: relative;
    }

    .flow-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100px;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      transition: all 0.3s ease;
      color: #fff;
    }

    .flow-node:hover .icon-wrapper {
      transform: scale(1.1);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .flow-node.cloudflare:hover .icon-wrapper {
      border-color: #f48220;
      box-shadow: 0 0 15px rgba(244, 130, 32, 0.2);
    }

    .node-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .flow-node:hover .node-label {
      color: #fff;
    }

    .flow-arrow {
      height: 2px;
      flex-grow: 1;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      position: relative;
      margin: 0 15px;
      opacity: 0.5;
    }

    .flow-arrow::after {
      content: '→';
      position: absolute;
      right: -2px;
      top: -10px;
      color: var(--secondary);
      font-weight: bold;
    }

    /* Footer Info */
    .footer-info {
      margin-top: 40px;
      padding-top: 25px;
      border-top: 1px solid var(--card-border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .domain-name {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .domain-name:hover {
      color: #22d3ee;
      text-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="status-badge">
        <span class="status-dot"></span>
        Successfully Linked & Live
      </div>

      <h1>Aditya's Demo Space</h1>
      <p class="subtitle">A premium HTML page hosted securely on GitHub Pages and routed globally via Cloudflare DNS.</p>

      <div class="flow-diagram">
        <div class="flow-node">
          <div class="icon-wrapper">💻</div>
          <div class="node-label">HTML5</div>
        </div>
        <div class="flow-arrow"></div>
        <div class="flow-node">
          <div class="icon-wrapper">🐙</div>
          <div class="node-label">GitHub</div>
        </div>
        <div class="flow-arrow"></div>
        <div class="flow-node cloudflare">
          <div class="icon-wrapper">☁️</div>
          <div class="node-label">Cloudflare</div>
        </div>
      </div>

      <div class="footer-info">
        <p>Routed via Custom Subdomain:</p>
        <p style="margin-top: 8px; font-size: 1.25rem;">
          <a class="domain-name" href="http://demo.adityacode.com" target="_blank">demo.adityacode.com</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
